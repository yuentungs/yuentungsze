<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分析 | YT</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <style>
        [lang="en"] .zh { display: none !important; }
        [lang="zh"] .en { display: none !important; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">YT</div>
            <ul>
                <li><a href="./index.html"><span class="zh">首頁</span><span class="en">Home</span></a></li>
                <li><a href="./experience.html"><span class="zh">經歷</span><span class="en">Experience</span></a></li>
                <li><a href="./insights.html"><span class="zh">分析</span><span class="en">Insights</span></a></li>
                <li><a href="./services.html"><span class="zh">服務</span><span class="en">Services</span></a></li>
                <li><button class="lang-btn" onclick="toggleLang()">English</button></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2 class="section-title"><span class="zh">行業洞察</span><span class="en">Insights</span></h2>
        <article class="card">
            <h1 class="zh">中國汽車市場的十年變革 (2014-2030)</h1>
            <h1 class="en">China's Automotive Market Transformation (2014-2030)</h1>
            <p class="zh">詳細分析新能源汽車與燃油車的市場演變...</p>
            <p class="en">Detailed analysis of NEV and ICE market evolution...</p>
        </article>
    </div>

    <footer class="footer"><p>&copy; 2026 YT. All Rights Reserved.</p></footer>
    <script>
        function toggleLang() {
            const html = document.documentElement;
            const btn = document.querySelector('.lang-btn');
            if (html.getAttribute('lang') === 'zh') {
                html.setAttribute('lang', 'en');
                btn.textContent = '中文';
                localStorage.setItem('pref-lang', 'en');
            } else {
                html.setAttribute('lang', 'zh');
                btn.textContent = 'English';
                localStorage.setItem('pref-lang', 'zh');
            }
        }
        window.onload = () => {
            const pref = localStorage.getItem('pref-lang') || 'zh';
            document.documentElement.setAttribute('lang', pref);
            document.querySelector('.lang-btn').textContent = pref === 'zh' ? 'English' : '中文';
        };
    </script>
</body>
</html>
